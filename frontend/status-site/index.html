<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f0">
  <meta name="description" content="Browse and listen to Angklobot’s angklung arrangements, or pair your phone with the live instrument.">
  <title>Song library · Angklobot Studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><div class="topbar wrap">
    <a class="brand" aria-label="Angklobot Studio home" href="/"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>angklobot<small>STUDIO</small></span></a>
    <span class="server-state"><span id="status-dot" aria-hidden="true"></span><span id="status-title" role="status">Checking Studio…</span></span>
    <nav aria-label="Studio connections">
      <a id="open-pair" aria-disabled="true" href="#">Pair a phone</a>
      <a id="open-guest" class="primary" aria-disabled="true" href="#">Open Studio <span aria-hidden="true">↗</span></a>
    </nav>
  </div></header>
  <main class="wrap">
    <h1>Song library</h1>
    <p class="intro">Choose an angklung arrangement to hear it on your device.</p>
    <div id="library"><p role="status">Loading songs…</p><noscript>Enable JavaScript to browse and play the songs.</noscript></div>
  </main>
  <footer class="wrap"><div class="connection">
    <button id="refresh-status" type="button">Check Studio connection</button>
  </div><a id="open-legacy" aria-disabled="true" href="#">Legacy interface ↗</a></footer>
  <script src="/runtime-config.js"></script>
  <script src="/status.js"></script>
  <script defer src="/library.js"></script>
</body>
</html>
