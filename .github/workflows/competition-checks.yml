name: Competition checks
on:
  push:
    branches: [main, 'codex/competition-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r requirements.txt
      - run: npm test
        working-directory: frontend
      - run: python -m pytest -q
      - run: sh scripts/wireless/test-host.sh
      - run: npm run build:competition
        working-directory: frontend
